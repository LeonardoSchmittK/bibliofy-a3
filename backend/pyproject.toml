[project]
name = "bibliofy-backend"
version = "0.1.0"
description = "Back-end do Bibliofy (FastAPI + PostgreSQL)"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy>=2",
    "psycopg[binary]>=3",
    "alembic",
    "pwdlib[argon2]",
    "pyjwt",
    "python-multipart",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "time-machine",
    "testcontainers[postgres]",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integracao: testes que precisam de um PostgreSQL real (TEST_DATABASE_URL ou testcontainers)",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
