services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: bibliofy
      POSTGRES_PASSWORD: bibliofy
      POSTGRES_DB: bibliofy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bibliofy -d bibliofy"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
