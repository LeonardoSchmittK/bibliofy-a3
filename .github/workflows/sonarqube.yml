name: SonarQube

on:
  push:
    branches: [main, dev, docs/entendimento-sonarqube]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and run coverage
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run test:coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
