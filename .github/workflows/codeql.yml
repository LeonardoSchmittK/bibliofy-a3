name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "17 5 * * 1" # segundas, 05:17 UTC
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # enviar resultados para a aba Security
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python # backend (FastAPI)
            build-mode: none
          - language: javascript-typescript # frontend (React + Vite)
            build-mode: none
          - language: actions # as próprias workflows em .github/workflows
            build-mode: none

    steps:
      - uses: actions/checkout@v7

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Analisar
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
