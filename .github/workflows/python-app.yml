name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  workflow_call: # reaproveitado pelo cd.yml antes de publicar uma release

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bibliofy
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: bibliofy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bibliofy -d bibliofy_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://bibliofy@localhost:5432/bibliofy
      TEST_DATABASE_URL: postgresql+psycopg://bibliofy@localhost:5432/bibliofy_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # O uv lê backend/.python-version (3.14) e baixa o Python correto.
      - name: Instalar uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Instalar dependências (uv.lock + grupo dev)
        run: uv sync --locked --no-build --no-install-project

      - name: Lint (ruff check)
        run: uv run --locked --no-sync --no-build ruff check .

      - name: Formatação (ruff format --check)
        run: uv run --locked --no-sync --no-build ruff format --check .

      - name: Guarda do banco de testes
        run: uv run --locked --no-sync --no-build pytest tests/test_db_guard.py -v

      - name: Testes (pytest + cobertura)
        run: uv run --locked --no-sync --no-build pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend (eslint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Instalar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Lint (eslint)
        run: npm run lint

      - name: Build (tsc -b + vite build)
        run: npm run build

      - name: Testes unitarios e integracao
        run: npm test

      - name: Cobertura do frontend (minimo 59%)
        run: npm run test:coverage

      - name: Publicar relatório de cobertura do frontend
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore
          retention-days: 7

  # Job único para marcar como "required" na proteção de branch (main e dev).
  ci-ok:
    name: CI OK
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Verificar resultado dos jobs
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "backend: ${{ needs.backend.result }} | frontend: ${{ needs.frontend.result }}"
            exit 1
          fi
