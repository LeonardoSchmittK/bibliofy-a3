name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  workflow_call: # reaproveitado pelo cd.yml antes de publicar uma release

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bibliofy
          POSTGRES_PASSWORD: bibliofy
          POSTGRES_DB: bibliofy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bibliofy -d bibliofy_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://bibliofy:bibliofy@localhost:5432/bibliofy_test

    steps:
      - uses: actions/checkout@v7

      # O uv lê backend/.python-version (3.14) e baixa o Python correto.
      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Instalar dependências (uv.lock + grupo dev)
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Formatação (ruff format --check)
        run: uv run ruff format --check .

      - name: Testes (pytest + cobertura)
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend (eslint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Build (tsc -b + vite build)
        run: npm run build

  # Job único para marcar como "required" na proteção de branch (main e dev).
  ci-ok:
    name: CI OK
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Verificar resultado dos jobs
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "backend: ${{ needs.backend.result }} | frontend: ${{ needs.frontend.result }}"
            exit 1
          fi
