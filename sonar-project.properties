# Preencher com os valores da conta
sonar.projectKey=LeonardoSchmittK_bibliofy-a3
sonar.organization=leonardoschmittk

sonar.sourceEncoding=UTF-8

# Analisa código-fonte do backend e do frontend no mesmo projeto
sonar.sources=backend/app,frontend/src

# Diretórios de testes
sonar.tests=backend/tests,frontend/tests

# Exclusões para não analisar dependências, builds, cobertura nem arquivos de teste
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.venv/**,**/venv/**,**/*.test.*,**/*.spec.*

# Relatório LCOV gerado por "npm run test:coverage" dentro de frontend/
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
